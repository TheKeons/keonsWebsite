<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main>
        <div class="cards">
            {{range .}}
                <a class="card" href="/{{.Slug}}">
                    <div class="card-header">
                        <h2>{{.Title}}</h2>
                        <time>{{.Date.Format "02.01.06"}}</time>
                    </div>
                    <p>{{.Summary}}</p>
                </a>
            {{end}}
        </div>
    </main>
</body>
</html>
